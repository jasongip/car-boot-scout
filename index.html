<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BootFair Scout V7 | Stable Engine</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background: #000; color: #fff; touch-action: manipulation; }
        .loading-glow { box-shadow: 0 0 20px rgba(16, 185, 129, 0.4); border-radius: 50%; width: 40px; height: 40px; border: 3px solid #10b981; border-top-color: transparent; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-black text-white">
    <div id="app" class="min-h-screen max-w-md mx-auto flex flex-col relative">
        
        <!-- Header -->
        <header v-if="apiKey" class="p-5 flex justify-between items-center bg-black/80 backdrop-blur-lg sticky top-0 z-50 border-b border-white/5">
            <h1 class="font-black italic tracking-tighter text-lg uppercase">Scout <span class="text-emerald-500">Pro</span></h1>
            <div class="flex gap-4 items-center">
                <span v-if="lastModel" class="text-[8px] text-zinc-500 font-bold border border-zinc-800 px-2 py-0.5 rounded">{{ lastModel }}</span>
                <button @click="resetKey" class="text-[9px] text-zinc-600 font-bold uppercase underline">Reset</button>
            </div>
        </header>

        <!-- Main Logic -->
        <div v-if="!apiKey" class="p-10 flex-1 flex flex-col justify-center animate-in fade-in">
            <h1 class="text-5xl font-black italic text-emerald-500 mb-2 tracking-tighter uppercase italic">Ready.</h1>
            <p class="text-zinc-500 text-xs font-bold uppercase tracking-[0.3em] mb-12">Set your Gemini API key</p>
            <input v-model="tempKey" type="password" placeholder="Paste API Key" class="bg-zinc-900 border border-white/10 p-5 rounded-3xl w-full mb-6 outline-none focus:border-emerald-500 text-xl text-white">
            <button @click="saveKey" class="bg-emerald-500 text-black font-black py-5 rounded-3xl uppercase tracking-widest text-lg active:scale-95 transition-all shadow-xl shadow-emerald-500/20">Initialise System</button>
        </div>

        <main v-else class="flex-1 p-4 flex flex-col overflow-hidden relative">
            
            <!-- Scanner View -->
            <div v-show="!result" class="relative flex-1 rounded-[40px] overflow-hidden border border-white/10 bg-zinc-950 shadow-inner">
                <video ref="video" autoplay playsinline class="w-full h-full object-cover"></video>
                
                <!-- Overlay Loading -->
                <div v-if="loading" class="absolute inset-0 bg-black/95 flex flex-col items-center justify-center p-10 z-50">
                    <div class="loading-glow mb-8"></div>
                    <h3 class="text-2xl font-black italic text-emerald-500 mb-2 uppercase tracking-tighter">{{ loadingStep }}</h3>
                    <p class="text-zinc-500 text-[10px] font-bold uppercase tracking-[0.3em] animate-pulse">Processing Market Intelligence...</p>
                </div>

                <!-- Scanner Target -->
                <div v-if="!loading" class="absolute inset-0 flex items-center justify-center pointer-events-none">
                    <div class="w-64 h-64 border-2 border-emerald-500/20 rounded-[50px] relative">
                        <div class="absolute -top-1 -left-1 w-10 h-10 border-t-4 border-l-4 border-emerald-500 rounded-tl-[25px]"></div>
                        <div class="absolute -bottom-1 -right-1 w-10 h-10 border-b-4 border-r-4 border-emerald-500 rounded-br-[25px]"></div>
                    </div>
                </div>
            </div>

            <!-- Result Pop-up -->
            <div v-if="result" class="flex-1 overflow-y-auto pb-24 animate-in slide-in-from-bottom duration-500">
                <div class="bg-zinc-900 rounded-[45px] p-8 border border-white/10 shadow-2xl min-h-full">
                    <div class="mb-8">
                        <span class="text-emerald-500 text-[10px] font-black uppercase tracking-[0.3em] border border-emerald-500/20 px-3 py-1 rounded-full">{{ result.category }}</span>
                        <h2 class="text-4xl font-black italic leading-none mt-4 tracking-tighter">{{ result.itemName }}</h2>
                    </div>

                    <!-- Market Comparison -->
                    <div class="mb-8" v-if="result.ebayListings && result.ebayListings.length">
                        <p class="text-[10px] font-black text-zinc-500 uppercase tracking-widest mb-4 flex items-center gap-2">
                            <i data-lucide="line-chart" class="w-3 h-3 text-emerald-500"></i> eBay Sold Proof (UK)
                        </p>
                        <div class="flex gap-4 overflow-x-auto hide-scrollbar -mx-2 px-2">
                            <div v-for="l in result.ebayListings" class="min-w-[150px] bg-black rounded-[30px] border border-white/5 p-1">
                                <img :src="l.img" class="w-full h-32 object-cover rounded-[25px] bg-zinc-800">
                                <p class="text-center font-black py-3 text-emerald-400 text-lg">£{{ l.price }}</p>
                            </div>
                        </div>
                    </div>

                    <!-- Profit Summary -->
                    <div :class="profit > 15 ? 'bg-emerald-500 text-black shadow-emerald-500/20' : 'bg-zinc-800 text-white'" class="p-8 rounded-[40px] mb-8 shadow-2xl relative transition-all duration-500">
                        <p class="text-[10px] uppercase font-black opacity-60 mb-2">Potential Profit</p>
                        <div class="flex justify-between items-end">
                            <p class="text-7xl font-black tracking-tighter italic leading-none">£{{ profit }}</p>
                            <div class="text-right">
                                <p class="text-[9px] uppercase font-black opacity-60 mb-1">Avg Market</p>
                                <p class="text-2xl font-black italic">£{{ result.avgPrice }}</p>
                            </div>
                        </div>
                    </div>

                    <!-- Footer Actions -->
                    <div class="space-y-4">
                        <a :href="result.ebayUrl" target="_blank" class="flex items-center justify-center gap-3 w-full py-5 bg-white text-black rounded-3xl font-black uppercase text-xs tracking-widest shadow-xl active:scale-95">Verify History <i data-lucide="external-link" class="w-4 h-4"></i></a>
                        <button @click="resetScanner" class="w-full py-5 bg-zinc-800 text-zinc-400 rounded-3xl font-black uppercase text-xs tracking-widest flex items-center justify-center gap-2">Scan Next</button>
                    </div>
                </div>
            </div>

            <!-- Inputs -->
            <div v-show="!result" class="mt-4 flex flex-col gap-4">
                <div class="bg-zinc-900 border border-white/5 rounded-3xl p-5 flex justify-between items-center px-8">
                    <span class="text-[10px] font-black text-zinc-500 uppercase tracking-widest">Stall Price (£)</span>
                    <input v-model="buyPrice" type="number" class="bg-transparent text-right text-3xl font-black outline-none w-24 text-white italic">
                </div>
                <button @click="captureImage" :disabled="loading" class="w-full bg-emerald-500 text-black h-24 rounded-full flex items-center justify-center gap-4 active:scale-95 shadow-[0_20px_50px_rgba(16,185,129,0.25)] transition-all">
                    <i data-lucide="zap" class="w-8 h-8 fill-black"></i>
                    <span class="text-2xl font-black uppercase tracking-tight italic tracking-widest">Scout Market</span>
                </button>
            </div>
        </main>

        <canvas ref="canvas" class="hidden"></canvas>
    </div>

    <script>
        const { createApp, ref, onMounted, computed, nextTick } = Vue;

        createApp({
            setup() {
                const apiKey = ref(localStorage.getItem('gemini_api_key') || '');
                const tempKey = ref('');
                const video = ref(null);
                const canvas = ref(null);
                const loading = ref(false);
                const loadingStep = ref('');
                const result = ref(null);
                const buyPrice = ref(5);
                const lastModel = ref('');

                const saveKey = () => { if (tempKey.value) { apiKey.value = tempKey.value.trim(); localStorage.setItem('gemini_api_key', apiKey.value); location.reload(); } };
                const resetKey = () => { if(confirm("Clear Data?")){ localStorage.clear(); location.reload(); } };

                const startCamera = async () => {
                    try {
                        const stream = await navigator.mediaDevices.getUserMedia({ 
                            video: { facingMode: 'environment', width: { ideal: 1280 } }, audio: false 
                        });
                        video.value.srcObject = stream;
                    } catch (e) { alert("Enable Camera."); }
                };

                const captureImage = async () => {
                    if (loading.value) return;
                    loading.value = true;
                    loadingStep.value = "Capturing...";
                    
                    const ctx = canvas.value.getContext('2d', { alpha: false });
                    const scale = 640 / video.value.videoWidth; // 降至 640px 提高穩定度
                    canvas.value.width = 640;
                    canvas.value.height = video.value.videoHeight * scale;
                    ctx.drawImage(video.value, 0, 0, canvas.value.width, canvas.value.height);
                    
                    const b64 = canvas.value.toDataURL('image/jpeg', 0.5);
                    
                    try {
                        loadingStep.value = "Analysing...";
                        const ai = await callAI(b64);
                        
                        loadingStep.value = "Market Info...";
                        const ebay = await fetchEbay(ai.searchQuery);
                        
                        result.value = { 
                            ...ai, 
                            avgPrice: ebay ? ebay.avg : ai.est.toFixed(2), 
                            ebayListings: ebay ? ebay.items : [], 
                            ebayUrl: `https://www.ebay.co.uk/sch/i.html?_nkw=${encodeURIComponent(ai.searchQuery)}&LH_Sold=1&LH_Complete=1` 
                        };
                    } catch (err) {
                        alert(`System Notice: ${err.message}`);
                    } finally {
                        loading.value = false;
                        nextTick(() => lucide.createIcons());
                    }
                };

                const callAI = async (b64) => {
                    // 【關鍵修正】優先使用穩定版 1.5-flash，減少 404/503
                    const models = ['gemini-1.5-flash', 'gemini-3-flash-preview'];
                    const prompt = `Identify this item. Return JSON: {"itemName": "Brand Model", "category": "Tech|Toys|Fashion", "searchQuery": "keywords", "est": 20}`;
                    
                    for (let m of models) {
                        lastModel.value = m;
                        try {
                            const controller = new AbortController();
                            const tid = setTimeout(() => controller.abort(), 20000);

                            // 使用 v1 接口提高穩定性
                            const r = await fetch(`https://generativelanguage.googleapis.com/v1/models/${m}:generateContent?key=${apiKey.value}`, {
                                method: 'POST',
                                signal: controller.signal,
                                body: JSON.stringify({ contents: [{ parts: [{ text: prompt }, { inline_data: { mime_type: "image/jpeg", data: b64.split(',')[1] } }] }] })
                            });
                            
                            const d = await r.json();
                            clearTimeout(tid);

                            if (d.error) {
                                if (d.error.code === 503) throw new Error("Google Server Busy (503). Try again in 5s.");
                                if (d.error.code === 404) continue; // 找不到模型則換下一個
                                throw new Error(d.error.message);
                            }

                            return JSON.parse(d.candidates[0].content.parts[0].text.replace(/```json|```/g, ''));
                        } catch (e) {
                            if (e.message.includes('503')) throw e;
                            console.log(`Failed ${m}, trying next...`);
                            continue;
                        }
                    }
                    throw new Error("Market Intelligence Offline. Try again.");
                };

                const fetchEbay = async (q) => {
                    try {
                        const target = `https://www.ebay.co.uk/sch/i.html?_nkw=${encodeURIComponent(q)}&LH_Sold=1&LH_Complete=1`;
                        const r = await fetch(`https://corsproxy.io/?${encodeURIComponent(target)}`, { signal: AbortSignal.timeout(8000) });
                        const h = await r.text();
                        const items = [];
                        const pR = /£(\d+\.\d{2})/g;
                        const iR = /src="(https:\/\/i\.ebayimg\.com\/images\/g\/[^"]+)"/g;
                        while (items.length < 3) {
                            const p = pR.exec(h); const i = iR.exec(h);
                            if (!p || !i) break;
                            items.push({ price: parseFloat(p[1]), img: i[1] });
                        }
                        return items.length ? { items, avg: (items.reduce((s, x) => s + x.price, 0) / items.length).toFixed(2) } : null;
                    } catch (e) { return null; }
                };

                const profit = computed(() => {
                    if (!result.value) return 0;
                    const p = parseFloat(result.value.avgPrice);
                    return (p - (p * 0.132) - 5.50 - buyPrice.value).toFixed(2);
                });

                onMounted(() => { if (apiKey.value) startCamera(); lucide.createIcons(); });
                return { apiKey, tempKey, saveKey, resetKey, video, canvas, captureImage, loading, loadingStep, result, buyPrice, profit, lastModel, resetScanner: () => { result.value = null; nextTick(() => lucide.createIcons()); } };
            }
        }).mount('#app');
    </script>
</body>
</html>
