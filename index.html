<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BootFair Scout V8 | Official SDK</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background: #000; color: #fff; touch-action: manipulation; }
        .loading-ring { width: 40px; height: 40px; border: 3px solid #10b981; border-top-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-black text-white">
    <div id="app" class="min-h-screen max-w-md mx-auto flex flex-col relative">
        
        <!-- API Setup -->
        <div v-if="!apiKey" class="p-10 flex-1 flex flex-col justify-center animate-in fade-in">
            <h1 class="text-4xl font-black italic text-emerald-500 mb-2 tracking-tighter uppercase">Scout Pro</h1>
            <p class="text-zinc-500 text-xs font-bold uppercase tracking-[0.3em] mb-12">Enter Google AI Studio Key</p>
            <input v-model="tempKey" type="password" placeholder="Paste API Key" class="bg-zinc-900 border border-white/10 p-5 rounded-3xl w-full mb-6 outline-none focus:border-emerald-500 text-xl text-white">
            <button @click="saveKey" class="bg-emerald-500 text-black font-black py-5 rounded-3xl uppercase tracking-widest text-lg active:scale-95 shadow-xl shadow-emerald-500/20">Initialise System</button>
        </div>

        <template v-else>
            <!-- Header -->
            <header class="p-5 flex justify-between items-center bg-black/80 backdrop-blur-lg border-b border-white/5">
                <h1 class="font-black italic tracking-tighter text-lg uppercase">Scout <span class="text-emerald-500">v8</span></h1>
                <button @click="resetKey" class="text-[9px] text-zinc-600 font-bold uppercase underline">Reset API</button>
            </header>

            <main class="flex-1 p-4 flex flex-col overflow-hidden relative">
                <!-- Scanner View -->
                <div v-show="!result" class="relative flex-1 rounded-[45px] overflow-hidden border border-white/10 bg-zinc-950">
                    <video ref="video" autoplay playsinline class="w-full h-full object-cover"></video>
                    
                    <!-- Overlay Loading -->
                    <div v-if="loading" class="absolute inset-0 bg-black/95 flex flex-col items-center justify-center p-10 z-50">
                        <div class="loading-ring mb-8"></div>
                        <h3 class="text-2xl font-black italic text-emerald-500 mb-2 uppercase tracking-tighter">{{ loadingStep }}</h3>
                        <p class="text-zinc-500 text-[10px] font-bold uppercase tracking-[0.3em] animate-pulse">Consulting AI Engine...</p>
                    </div>

                    <!-- Scanner Target -->
                    <div v-if="!loading" class="absolute inset-0 flex items-center justify-center pointer-events-none">
                        <div class="w-64 h-80 border-2 border-emerald-500/20 rounded-[50px] relative">
                            <div class="absolute -top-1 -left-1 w-12 h-12 border-t-4 border-l-4 border-emerald-500 rounded-tl-[30px]"></div>
                            <div class="absolute -bottom-1 -right-1 w-12 h-12 border-b-4 border-r-4 border-emerald-500 rounded-br-[30px]"></div>
                        </div>
                    </div>
                </div>

                <!-- Result Card -->
                <div v-if="result" class="flex-1 overflow-y-auto pb-24 animate-in slide-in-from-bottom duration-500">
                    <div class="bg-zinc-900 rounded-[45px] p-8 border border-white/10 shadow-2xl min-h-full">
                        <div class="mb-8">
                            <span class="text-emerald-500 text-[10px] font-black uppercase tracking-[0.3em] bg-emerald-500/10 px-3 py-1 rounded-full">{{ result.category }}</span>
                            <h2 class="text-3xl font-black italic leading-tight mt-4 tracking-tighter">{{ result.itemName }}</h2>
                        </div>

                        <!-- eBay Matches -->
                        <div class="mb-8" v-if="result.ebayListings && result.ebayListings.length">
                            <div class="flex gap-4 overflow-x-auto hide-scrollbar -mx-2 px-2">
                                <div v-for="l in result.ebayListings" class="min-w-[150px] bg-black rounded-[30px] border border-white/5 p-1">
                                    <img :src="l.img" class="w-full h-32 object-cover rounded-[25px] bg-zinc-800 shadow-inner">
                                    <p class="text-center font-black py-3 text-emerald-400 text-xl italic tracking-tighter">£{{ l.price }}</p>
                                </div>
                            </div>
                        </div>

                        <!-- Profit Highlight -->
                        <div :class="profit > 15 ? 'bg-emerald-500 text-black shadow-emerald-500/20' : 'bg-zinc-800 text-white shadow-black/50'" class="p-8 rounded-[40px] mb-8 shadow-2xl transition-all duration-500">
                            <p class="text-[10px] uppercase font-black opacity-60 mb-2 leading-none tracking-widest">Est. Net Profit</p>
                            <div class="flex justify-between items-end">
                                <p class="text-7xl font-black tracking-tighter italic leading-none">£{{ profit }}</p>
                                <div class="text-right">
                                    <p class="text-[9px] uppercase font-black opacity-60 mb-1">Avg Market</p>
                                    <p class="text-2xl font-black italic">£{{ result.avgPrice }}</p>
                                </div>
                            </div>
                        </div>

                        <div class="space-y-4">
                            <a :href="result.ebayUrl" target="_blank" class="flex items-center justify-center gap-3 w-full py-5 bg-white text-black rounded-3xl font-black uppercase text-xs tracking-[0.2em] shadow-xl">Verify Market <i data-lucide="external-link" class="w-4 h-4"></i></a>
                            <button @click="resetScanner" class="w-full py-5 bg-zinc-800 text-white rounded-3xl font-black uppercase text-xs tracking-[0.2em] flex items-center justify-center gap-2">New Scan</button>
                        </div>
                    </div>
                </div>

                <!-- Footer Inputs -->
                <div v-show="!result" class="mt-4 flex flex-col gap-4">
                    <div class="bg-zinc-900 border border-white/5 rounded-3xl p-5 flex justify-between items-center px-8 shadow-xl">
                        <span class="text-[10px] font-black text-zinc-500 uppercase tracking-widest leading-none">Asking Price (£)</span>
                        <input v-model="buyPrice" type="number" class="bg-transparent text-right text-3xl font-black outline-none w-24 text-white">
                    </div>
                    <button @click="captureImage" :disabled="loading" class="w-full bg-emerald-500 text-black h-24 rounded-full flex items-center justify-center gap-4 active:scale-95 shadow-[0_20px_60px_rgba(16,185,129,0.3)] transition-all">
                        <i data-lucide="zap" class="w-8 h-8 fill-black"></i>
                        <span class="text-2xl font-black uppercase tracking-tight italic">Scout Now</span>
                    </button>
                </div>
            </main>
        </template>
        <canvas ref="canvas" class="hidden"></canvas>
    </div>

    <!-- 關鍵：引入 Google AI SDK -->
    <script type="importmap">
    {
      "imports": {
        "@google/generative-ai": "https://esm.run/@google/generative-ai"
      }
    }
    </script>
    <script type="module">
        import { GoogleGenerativeAI } from "@google/generative-ai";
        const { createApp, ref, onMounted, computed, nextTick } = Vue;

        createApp({
            setup() {
                const apiKey = ref(localStorage.getItem('gemini_api_key') || '');
                const tempKey = ref('');
                const video = ref(null);
                const canvas = ref(null);
                const loading = ref(false);
                const loadingStep = ref('');
                const result = ref(null);
                const buyPrice = ref(5);

                const saveKey = () => { if (tempKey.value) { apiKey.value = tempKey.value.trim(); localStorage.setItem('gemini_api_key', apiKey.value); location.reload(); } };
                const resetKey = () => { if(confirm("Clear API Cache?")){ localStorage.clear(); location.reload(); } };

                const startCamera = async () => {
                    try {
                        const stream = await navigator.mediaDevices.getUserMedia({ 
                            video: { facingMode: 'environment', width: { ideal: 1280 } }, audio: false 
                        });
                        video.value.srcObject = stream;
                    } catch (e) { alert("Please enable camera access."); }
                };

                const captureImage = async () => {
                    if (loading.value) return;
                    loading.value = true;
                    loadingStep.value = "Capturing...";
                    
                    const ctx = canvas.value.getContext('2d', { alpha: false });
                    const scale = 500 / video.value.videoWidth; 
                    canvas.value.width = 500;
                    canvas.value.height = video.value.videoHeight * scale;
                    ctx.drawImage(video.value, 0, 0, canvas.value.width, canvas.value.height);
                    const b64 = canvas.value.toDataURL('image/jpeg', 0.5);
                    
                    try {
                        loadingStep.value = "AI Reasoning...";
                        const ai = await callOfficialSDK(b64);
                        
                        loadingStep.value = "UK Market Live...";
                        const ebay = await fetchEbay(ai.searchQuery);
                        
                        result.value = { 
                            ...ai, 
                            avgPrice: ebay ? ebay.avg : ai.est.toFixed(2), 
                            ebayListings: ebay ? ebay.items : [], 
                            ebayUrl: `https://www.ebay.co.uk/sch/i.html?_nkw=${encodeURIComponent(ai.searchQuery)}&LH_Sold=1&LH_Complete=1` 
                        };
                    } catch (err) {
                        alert(`AI Error: ${err.message}`);
                    } finally {
                        loading.value = false;
                        nextTick(() => lucide.createIcons());
                    }
                };

                const callOfficialSDK = async (b64) => {
                    // 使用官方 SDK
                    const genAI = new GoogleGenerativeAI(apiKey.value);
                    // 優先使用 1.5 Flash (最穩定)
                    const model = genAI.getGenerativeModel({ model: "gemini-1.5-flash" });
                    
                    const prompt = `Identify this item for UK resale. Return ONLY a JSON: {"itemName": "Brand Model", "category": "...", "searchQuery": "keywords", "est": 25}`;
                    
                    const imageData = {
                        inlineData: {
                            data: b64.split(',')[1],
                            mimeType: "image/jpeg"
                        }
                    };

                    try {
                        const result = await model.generateContent([prompt, imageData]);
                        const response = await result.response;
                        const text = response.text();
                        return JSON.parse(text.replace(/```json|```/g, ''));
                    } catch (e) {
                        console.error(e);
                        // 如果 1.5 Flash 報錯，嘗試自動 Failover 到 Gemini 3 (如果有權限)
                        throw new Error(`Google API: ${e.message}`);
                    }
                };

                const fetchEbay = async (q) => {
                    try {
                        const target = `https://www.ebay.co.uk/sch/i.html?_nkw=${encodeURIComponent(q)}&LH_Sold=1&LH_Complete=1`;
                        const r = await fetch(`https://corsproxy.io/?${encodeURIComponent(target)}`, { signal: AbortSignal.timeout(8000) });
                        const h = await r.text();
                        const items = [];
                        const pR = /£(\d+\.\d{2})/g;
                        const iR = /src="(https:\/\/i\.ebayimg\.com\/images\/g\/[^"]+)"/g;
                        while (items.length < 3) {
                            const p = pR.exec(h); const i = iR.exec(h);
                            if (!p || !i) break;
                            items.push({ price: parseFloat(p[1]), img: i[1] });
                        }
                        return items.length ? { items, avg: (items.reduce((s, x) => s + x.price, 0) / items.length).toFixed(2) } : null;
                    } catch (e) { return null; }
                };

                const profit = computed(() => {
                    if (!result.value) return 0;
                    const p = parseFloat(result.value.avgPrice);
                    return (p - (p * 0.132) - 5.50 - buyPrice.value).toFixed(2);
                });

                onMounted(() => { if (apiKey.value) startCamera(); lucide.createIcons(); });
                return { apiKey, tempKey, saveKey, resetKey, video, canvas, captureImage, loading, loadingStep, result, buyPrice, profit, resetScanner: () => { result.value = null; nextTick(() => lucide.createIcons()); } };
            }
        }).mount('#app');
    </script>
</body>
</html>
